<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <!-- Background -->
  <rect width="200" height="150" fill="#E9F4F9"/>

  <!-- Mountain silhouette -->
  <defs>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#BEDEED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0A1A2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Left peak -->
  <polygon points="20,120 50,60 80,120" fill="url(#mountainGrad)" opacity="0.8"/>

  <!-- Center peak (tallest) -->
  <polygon points="60,120 100,40 140,120" fill="url(#mountainGrad)" opacity="0.9"/>

  <!-- Right peak -->
  <polygon points="120,120 150,70 180,120" fill="url(#mountainGrad)" opacity="0.8"/>

  <!-- Base line -->
  <line x1="0" y1="120" x2="200" y2="120" stroke="#707273" stroke-width="1" opacity="0.5"/>
</svg>
