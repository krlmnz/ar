# Andean Road studio — separate Netlify site from the public Eleventy build.
# In the Netlify UI set the base directory to `editor/`.
# This file is read when that base directory is the site root for config.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
