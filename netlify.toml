[build]
command = "npm run build"
publish = "_site"
functions = "functions"

[build.environment]
NODE_VERSION = "20"

[[headers]]
for = "/api/*"
[headers.values]
Access-Control-Allow-Origin = "*"
Access-Control-Allow-Methods = "GET, OPTIONS"
Access-Control-Allow-Headers = "Content-Type"

[[headers]]
for = "/*.jpg"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.jpeg"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.png"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.webp"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.svg"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# The public template gallery and demo URLs moved behind the studio gate.
# Do not force a trailing slash on /places/:slug — Netlify already does that,
# and force = true matches the slashed URL and redirects it to itself.
[[redirects]]
from = "/api/studio"
to = "/.netlify/functions/studio"
status = 200
force = true

[[redirects]]
from = "/api/posts"
to = "/.netlify/functions/posts"
status = 200
force = true

# Published notes that are not in the latest build yet. A file at the same
# path wins once Eleventy has generated it, because this redirect is not forced.
[[redirects]]
from = "/notes/*"
to = "/notes/view/?slug=:splat"
status = 200

[[redirects]]
from = "/templates/*"
to = "/editor/templates/:splat"
status = 301
force = true

[[redirects]]
from = "/demo/*"
to = "/editor/templates/:splat"
status = 301
force = true

[[plugins]]
package = "./netlify/plugins/studio-drafts"
