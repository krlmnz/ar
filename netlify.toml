[build]
# tokens:check fails the deploy if tokens.css drifted from the engine output —
# the whole point of the drift detector is that it runs where it can say no.
command = "npm run tokens:check && npm run build"
publish = "_site"

[build.environment]
NODE_VERSION = "20"

[[headers]]
for = "/api/*"
[headers.values]
Access-Control-Allow-Origin = "*"
Access-Control-Allow-Methods = "GET, OPTIONS"
Access-Control-Allow-Headers = "Content-Type"

[[headers]]
for = "/*.jpg"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.jpeg"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.png"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.webp"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.svg"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
from = "/places/:slug"
to = "/places/:slug/"
status = 301
force = true

# The Map Atelier moved from /tools/map-atelier/ to /atelier/editor/ (brief 1.4).
# Two rules, because Netlify's /path/* splat does not match the slashless
# /tools/map-atelier. The splat form preserves the filename, which matters:
# published share links point at guest.html#v=<payload>, and redirecting those
# to the landing page would strip a reader's map into a marketing page.
[[redirects]]
from = "/tools/map-atelier"
to = "/atelier/editor/"
status = 301

[[redirects]]
from = "/tools/map-atelier/*"
to = "/atelier/editor/:splat"
status = 301
