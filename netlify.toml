[build]
command = "npm run build"
publish = "_site"
functions = "functions"

[build.environment]
NODE_VERSION = "20"

[[headers]]
for = "/api/*"
[headers.values]
Access-Control-Allow-Origin = "*"
Access-Control-Allow-Methods = "GET, OPTIONS"
Access-Control-Allow-Headers = "Content-Type"

[[headers]]
for = "/*.jpg"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.jpeg"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.png"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.webp"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.svg"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
from = "/places/:slug"
to = "/places/:slug/"
status = 301
force = true

# The public template gallery and demo URLs moved behind the studio gate.
[[redirects]]
from = "/templates/*"
to = "/editor/templates/:splat"
status = 301
force = true

[[redirects]]
from = "/demo/*"
to = "/editor/templates/:splat"
status = 301
force = true
